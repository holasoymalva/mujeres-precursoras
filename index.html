<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precursoras del Feminismo</title>
    <meta name="description" content="Una línea del tiempo interactiva sobre las precursoras del feminismo.">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <main id="app">
        <!-- Pantalla de Introducción -->
        <section id="intro-section" class="intro-section">
            <div id="image-container" class="image-container"></div>
            
            <div class="intro-text">
                <h1>Precursoras del <br> <span class="highlight">feminismo</span></h1>
            </div>
            
            <!-- Indicador para hacer scroll más adelante -->
            <div class="scroll-indicator" id="scroll-indicator">
                <span>Descubre la línea del tiempo</span>
                <div class="mouse">
                    <div class="wheel"></div>
                </div>
            </div>
        </section>
        
        <!-- Sección de la línea del tiempo (Se desarrollará en los siguientes pasos) -->
        <section id="timeline-section" class="timeline-section">
            <div class="timeline-content">
                <!-- Aquí irá el contenido de la línea del tiempo -->
                <h2>La historia comienza aquí...</h2>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
